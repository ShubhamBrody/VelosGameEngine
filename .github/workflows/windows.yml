name: Windows Native Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  native:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Build and test
        shell: pwsh
        run: ./tools/build.ps1 -Configuration ${{ matrix.configuration }} -Test
      - name: Native WARP smoke
        shell: pwsh
        run: ./tools/smoke.ps1 -Configuration ${{ matrix.configuration }} -Adapter warp