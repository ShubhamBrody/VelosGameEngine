name: Windows Native Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  native:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Build and test
        shell: pwsh
        run: ./tools/build.ps1 -Configuration ${{ matrix.configuration }} -Test
      - name: Native WARP smoke
        shell: pwsh
        run: ./tools/smoke.ps1 -Configuration ${{ matrix.configuration }} -Adapter warp
      - name: Graphics WARP smoke
        if: matrix.configuration == 'Release'
        shell: pwsh
        run: ./tools/graphics-smoke.ps1 -Configuration Release -Adapter warp
      - name: MCP WARP workflow
        if: matrix.configuration == 'Release'
        shell: pwsh
        run: ./tools/mcp-smoke.ps1 -Configuration Release -BuildDirectory out/build -Adapter warp
      - name: Branding assets and WARP startup
        if: matrix.configuration == 'Release'
        shell: pwsh
        run: |
          npm ci --prefix tools/branding --ignore-scripts --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'Branding dependencies failed to install.' }
          npm test --prefix tools/branding
          if ($LASTEXITCODE -ne 0) { throw 'Brand asset tests failed.' }
          ./tools/branding-smoke.ps1 -Configuration Release -BuildDirectory out/build -Adapter warp